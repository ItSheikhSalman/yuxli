services:
  - type: web
    name: yuxli-whatsapp-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: LEVIX_DATA_DIR
        value: /data
      - key: RENDER
        value: "true"

